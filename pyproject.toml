[project]
name = "persistent-kv-cache-engine-python"
version = "0.1.0"
requires-python = ">=3.14.4"
dependencies = [
    "fastapi[standard]>=0.141.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-s"
pythonpath = [".", "tests"]
